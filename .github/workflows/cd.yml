name: CD to server
on:
  push:
    branches:
      - master
    paths-ignore:
      - components
      - README.md
      - .gitignore
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to dev
        uses: fifsky/ssh-action@master
        env:
          UBUNTU_FRONTEND: noninteractive
        with:
            command: |
              cd ${{ secrets.DEPLOYMENT_PROJECT_PATH }} 
              git reset --hard origin/master
              git pull origin/master
  
              docker compose -f ./deploy/docker-compose.yml down
              docker run -v $PWD:/build --workdir /build node npm install
              docker run -v $PWD:/build --workdir /build node npm run build
              docker compose -f ./deploy/docker-compose.yml up -d

            host: ${{ secrets.DEPLOYMENT_HOST }}
            port: ${{ secrets.DEPLOYMENT_PORT }}
            user: ${{ secrets.DEPLOYMENT_USER }}
            key: ${{ secrets.DEPLOYMENT_PRIV_KEY }}
